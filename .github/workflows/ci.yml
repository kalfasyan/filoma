name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  lint-and-test:
    runs-on: ubuntu-latest
    # Skip CI for version bump commits since publish workflow will run tests
    if: ${{ !contains(github.event.head_commit.message, 'Bump version') }}
    needs: pre-commit
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
      - name: Install package with all optional extras
        run: pip install -e ".[all]"
      - name: Run ruff
        run: ruff check .
      - name: Check bundled skills reference real commands and tools
        run: python scripts/check_skills.py
        env:
          PYTHONPATH: src
      - name: Run pytest
        run: pytest tests/ -m "not integration"

  # The base install (no extras) must keep working: this is what `pip install filoma`
  # and the filoma-audit GitHub Action give users. Tests that need the agent / RAG /
  # pandas extras skip themselves via pytest.importorskip.
  minimal-install:
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Bump version') }}
    needs: pre-commit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e .
      - name: Smoke-test the core CLI
        run: |
          filoma --version
          mkdir -p smoke-data
          echo hello > smoke-data/a.txt
          echo hello > smoke-data/b.txt
          printf 'gates:\n  corrupted_files: 0\n  zero_byte_files: 0\n' > smoke-gates.yml
          filoma audit smoke-data --gates smoke-gates.yml --export smoke-report.json --format json
          python -c "import filoma as flm; flm.probe('smoke-data'); flm.probe_to_df('smoke-data')"
      - name: Agent commands explain the missing extra
        run: |
          if filoma ask "hi"; then echo "expected a non-zero exit without the agent extra"; exit 1; fi
      - name: Run pytest
        run: pytest tests/ -m "not integration"

  # Traversal semantics (symlinks, hidden files, NTFS handling) are the most
  # platform-sensitive part of filoma, and wheels are already built for these
  # platforms in publish.yml. Non-blocking until the suite is confirmed green
  # there; drop `continue-on-error` once it is.
  cross-platform:
    name: ${{ matrix.os }} (non-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    if: ${{ !contains(github.event.head_commit.message, 'Bump version') }}
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e .
      - name: Run pytest
        run: pytest tests/ -m "not integration"
