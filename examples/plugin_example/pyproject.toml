[project]
name = "filoma-wordcount"
version = "0.1.0"
description = "Example filoma plugin: adds a count_words tool to the Filaraki agent and the MCP server"
requires-python = ">=3.11"
dependencies = ["filoma[agent]"]

# filoma discovers third-party tools through this entry-point group.
# The value is "<module>:<callable>"; filoma calls the callable once, lazily.
[project.entry-points."filoma.tools"]
wordcount = "filoma_wordcount:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["filoma_wordcount"]
